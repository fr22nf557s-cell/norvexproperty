name: Pages status

# Read-only check of the GitHub Pages site for this repository: whether it is
# enabled, which domain it serves, build status and certificate state.
# Enabling Pages itself needs a repository admin in Settings > Pages
# (Source: Deploy from a branch, main, root); the CNAME file then sets the domain.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R: ${{ github.repository }}
    steps:
      - name: Report
        run: |
          if gh api "repos/$R/pages" > pages.json 2>/dev/null; then
            node -pe 'const p=JSON.parse(require("fs").readFileSync("pages.json"));["url",p.html_url,"domain",p.cname,"status",p.status,"https_enforced",p.https_enforced,"cert",p.https_certificate&&p.https_certificate.state,"protected_domain",p.protected_domain_state].join(" | ")'
          else
            echo "Pages is not enabled yet: Settings > Pages > Source: Deploy from a branch > main / (root) > Save"
            exit 1
          fi
