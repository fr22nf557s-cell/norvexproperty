name: Pages setup

# Turns on GitHub Pages for this repository (deploy from the main branch, root)
# and sets the custom domain from the CNAME file. Safe to run again.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Create the Pages site (deploy from main, root)
        run: |
          if gh api "repos/$R/pages" >/dev/null 2>&1; then
            echo "Pages already enabled"
          else
            gh api -X POST "repos/$R/pages" -f build_type=legacy -f 'source[branch]=main' -f 'source[path]=/'
          fi
      - name: Set the custom domain
        run: |
          gh api -X PUT "repos/$R/pages" -f cname="$(tr -d '\n' < CNAME)" -f build_type=legacy -f 'source[branch]=main' -f 'source[path]=/' || true
          gh api "repos/$R/pages" | node -pe 'const p=JSON.parse(require("fs").readFileSync(0)); ["html_url",p.html_url,"cname",p.cname,"status",p.status,"https",p.https_enforced].join(" ")'
